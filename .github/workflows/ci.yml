name: CI

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:    
      # Push events on main branch
      - main
    # Sequence of patterns matched against refs/tags
    tags: '*'
  # Pull requests too. Without this the suite ran only AFTER a merge, so a pull request's
  # single green check was the Documentation build and nothing else -- which is how two
  # branches that were each green on their own landed together red: neither had ever run the
  # other's tests.
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: auto
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - os: macOS-latest
            arch: x86
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      # Coverage off: `julia-runtest` instruments by default, and the two steps that used to
      # follow -- `julia-processcoverage` and `codecov-action` -- uploaded a report nobody
      # reads. Instrumentation is not free, and neither is a badge that no decision depends on.
      # The suite lists the release's assets through the GitHub API, which allows 60
      # unauthenticated requests an hour per IP -- shared across runners, so a job can fail on
      # requests other jobs used up ("403 rate limit exceeded", seen on #59). With the token the
      # limit is the token's; `_api_headers` sends it to api.github.com only.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The `textsearch` app is its own project (apps/textsearch, with TextSearch from this checkout
  # through [sources]), and `julia-runtest` only tests the package at the root. So nothing ran
  # its tests: #58 changed how the app loads its readers and #59 added five commands' worth of
  # LSI handling, and the green checks on both covered none of it.
  app-test:
    name: textsearch app - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: auto
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-app-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-app-${{ env.cache-name }}-
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-
      # No Manifest is committed for the app, so this resolves it fresh, the same way
      # `pkg"app develop apps/textsearch"` does on a user's machine.
      - name: Test the textsearch app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=apps/textsearch -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
