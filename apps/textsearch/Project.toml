version = "1.0.0"

[deps]
ArgParse = "c7e460c6-2fb9-53a9-8c5b-16f535851c63"
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
Parquet2 = "98572fba-bba0-415d-956f-fa77e587d26d"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Tables = "bd369af6-aec1-5ad0-b16a-f7cc5008161c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TextSearch = "7f6f6c8a-3b03-11e9-223d-e7d88259bd6c"

[sources]
TextSearch = {path = "../.."}

[compat]
julia = "1.12"

[apps.textsearch]
# Threads cannot be set after Julia starts, so the thread count has to come from the shim
# Pkg generates. Every stage of `fit` (tokenization, LSI, the synonym search) is threaded
# through @BATCHES, so a single-threaded default would silently run the expensive work on
# one core.
julia_flags = ["--startup-file=no", "--history-file=no", "--threads=auto"]
